# IonTrace CI and deployment.
#
# The physics tests gate the deployment. The site is only published if the
# suite passes, so a change that breaks a conservation law, a symmetry, or a
# closed-form limit cannot reach the public page. For a simulator whose failure
# mode is a wrong trajectory that looks entirely plausible, that gate is the
# point of having CI at all.
#
# No build step and no dependencies: the tests run the same ES modules the
# browser loads, and the site is published as plain static files.

name: tests and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: physics tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No install step: the project has no dependencies by design.
      - name: Run the physics suite
        run: node tests/run-node.js

  deploy:
    name: deploy to Pages
    # Publishing unvalidated physics is the thing this repository is trying to
    # avoid, so deployment waits for the suite.
    needs: test
    if: "github.ref == 'refs/heads/main' && github.event_name != 'pull_request'"
    runs-on: ubuntu-latest

    # Naming any permission sets every unnamed one to none, so contents: read
    # has to be spelled out or the checkout below has no rights.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # enablement: true switches the repository's Pages source to GitHub
      # Actions through the API, so a fresh clone or a fork deploys without
      # anyone having to find the setting first. Without it the action fails
      # with "Get Pages site failed" whenever Pages is unset or still in
      # deploy-from-a-branch mode.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # The whole repository is the site, including tests/ so the physics
      # suite is runnable from the live page.
      #
      # Hidden files are left out, which is the behaviour wanted here: it
      # keeps .git and .github off the public site. .nojekyll is not needed in
      # the artifact because Actions-deployed Pages serves it verbatim and
      # never runs Jekyll; the file stays in the repository so that branch
      # deploys, which do run Jekyll, still behave.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v5
